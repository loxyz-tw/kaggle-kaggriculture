[project]
name = "kaggriculture"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kaggle>=2.2.4",
    "kaggle-environments>=1.32.7",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
    "pytest>=8.3",
]
rl = [
    "jax[cuda12]==0.10.1",
    "optax>=0.2.8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
